<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- user-scalable=no : on ne veut pas que deux doigts zooment la page (ils servent à regarder ailleurs) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Tunnel</title>
  <meta name="description" content="Petit jeu de minage tranquille, à jouer en écoutant un podcast.">
  <meta name="theme-color" content="#08090c">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Le jeu entier est dessiné dans ce « tableau » (canvas) -->
  <canvas id="jeu"></canvas>
  <!-- Calque par-dessus : le mineur, les mini-objets et la poussière, dessinés bien nets -->
  <canvas id="calque"></canvas>

  <!-- Énergie de la lampe : un trait très fin tout en haut -->
  <div id="energie"><div id="energie-niveau"></div></div>

  <!-- Fin d'expédition (quand la lampe s'éteint) -->
  <div id="fin" hidden>
    <div class="fin-carte">
      <h1>Expédition terminée</h1>
      <p class="fin-prof">Profondeur atteinte <b id="fin-profondeur">0 m</b></p>
      <div id="fin-butin"></div>
      <button id="fin-rejouer">Nouvelle expédition</button>
    </div>
  </div>

  <!-- Bandeau « trouvaille » (gros cristal ou fossile ramassé) -->
  <div id="trouvaille" hidden><canvas id="trouvaille-dessin"></canvas><span id="trouvaille-nom"></span></div>

  <!-- Ce qu'on a ramassé (rempli par app.js) -->
  <div id="compteur"></div>

  <!-- Tout en bas à gauche : son, lance-pierre (activé ou non), taille du grattoir -->
  <div id="reglages-bas">
    <button id="bouton-son" aria-label="Activer le son"></button>
    <button id="bouton-lance" aria-label="Activer le lance-pierre"></button>
    <input id="taille-grattoir" type="range" min="0.5" max="2" step="0.05" value="1" aria-label="Taille du grattoir">
  </div>
  <!-- Déplacement : joystick (gauche / droite = marcher, vers le haut = sauter) -->
  <div id="joystick" aria-label="Joystick : marcher et sauter"><div id="joy-bouton"></div></div>

  <!-- Outils du lance-pierre, en haut à droite (les dessins sont ajoutés par app.js) -->
  <div id="outils">
    <button data-outil="grappin" aria-label="Grappin : s'accroche à la roche"></button>
    <button data-outil="rebond" aria-label="Rebond : rebondit sur la roche"></button>
    <button data-outil="perce" aria-label="Perce : casse la terre et le sable"></button>
  </div>

  <!-- Zoom (on peut aussi pincer à deux doigts) -->
  <div id="zoom">
    <button data-zoom="-1" aria-label="Voir de plus loin"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="3" y="6" width="8" height="2" fill="currentColor"/></svg></button>
    <button data-zoom="1" aria-label="Voir de plus près"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="3" y="6" width="8" height="2" fill="currentColor"/><rect x="6" y="3" width="2" height="8" fill="currentColor"/></svg></button>
  </div>

  <!-- Profondeur et version, discrètes en haut au milieu -->
  <div id="profondeur">0 m</div>
  <div id="version"></div>

  <script src="app.js"></script>
</body>
</html>
