<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Tunnel</title>
  <meta name="description" content="Petit jeu de minage tranquille, à jouer en écoutant un podcast.">
  <meta name="theme-color" content="#08090c">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Le monde (petite image agrandie ×3 sans flou) -->
  <canvas id="monde"></canvas>
  <!-- Compagnon : vraie image (GIF animé), placée par app.js -->
  <img id="compagnon" alt="" hidden>
  <!-- Calque du dessus (net) : contours des zones, %, chiffres, cérémonie des trouvailles. C'est lui qui reçoit le doigt. -->
  <canvas id="dessus"></canvas>

  <!-- En haut à gauche : le sac (valeur totale) -->
  <button id="b-sac" class="bouton" aria-label="Sac"><span class="icone" data-icone="sac"></span><span id="sac-total">0</span></button>
  <!-- En haut à droite : collection et réglages -->
  <div id="haut-droite">
    <button id="b-collection" class="bouton carre" aria-label="Trouvailles"><span class="icone" data-icone="livre"></span></button>
    <button id="b-reglages" class="bouton carre" aria-label="Réglages"><span class="icone" data-icone="roue"></span></button>
  </div>

  <!-- Bandeau (trouvaille, nouvelle zone…) -->
  <div id="bandeau" class="cache"></div>

  <!-- Outils, en colonne à droite -->
  <div id="outils">
    <button class="bouton carre" data-outil="jet" aria-label="Jet d'énergie"><span class="icone" data-icone="jet"></span></button>
    <button class="bouton carre" data-outil="pinceau" aria-label="Pinceau"><span class="icone" data-icone="pinceau"></span></button>
    <button class="bouton carre" data-outil="pioche" aria-label="Pioche"><span class="icone" data-icone="pioche"></span></button>
    <button class="bouton carre" data-outil="bombe" aria-label="Bombe"><span class="icone" data-icone="bombe"></span><em id="nb-bombes">0</em></button>
  </div>

  <!-- Déplacement -->
  <div id="joystick" aria-label="Joystick : marcher"><div id="joy"></div></div>

  <!-- Panneau en bas (réglages, sac, trouvailles, compagnon) : rempli par app.js -->
  <div id="panneau" hidden>
    <div class="tete"><b id="panneau-titre"></b><button id="panneau-fermer" aria-label="Fermer"><span class="icone" data-icone="croix"></span></button></div>
    <div id="panneau-corps"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
