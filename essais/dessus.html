<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<title>Tunnel — vue de dessus</title>
<style>
  /* Essai 2 : vue de dessus + jet d'énergie. Tout est dans ce fichier. */
  :root {
    --encre: #1d1726; --bouton: rgba(29, 23, 38, 0.82); --reflet: #3a3046; --actif: #3a3046; --actif-reflet: #5a4c66;
    --pixel: polygon(0 4px, 2px 4px, 2px 2px, 4px 2px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 2px, calc(100% - 2px) 2px, calc(100% - 2px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 2px) calc(100% - 4px), calc(100% - 2px) calc(100% - 2px), calc(100% - 4px) calc(100% - 2px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 2px), 2px calc(100% - 2px), 2px calc(100% - 4px), 0 calc(100% - 4px));
  }
  html, body { margin: 0; height: 100%; overflow: hidden; position: fixed; inset: 0; background: #050507; overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #monde { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; will-change: transform; }
  #compagnon { position: absolute; left: 0; top: 0; pointer-events: none; image-rendering: pixelated; will-change: transform, filter; }
  #dessus { position: absolute; inset: 0; touch-action: none; }
  #haut { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; gap: 6px; }
  #haut button, #haut a {
    height: 32px; padding: 0 10px; border: 0; clip-path: var(--pixel); background: var(--bouton);
    box-shadow: inset 0 0 0 2px var(--encre), inset 0 2px 0 2px var(--reflet);
    color: #ffe7c2; font: bold 12px monospace; display: flex; align-items: center; text-decoration: none; white-space: nowrap;
  }
  #haut a { margin-left: auto; color: #a89a86; }
  #haut b { color: #a89a86; font-weight: normal; margin-right: 6px; }
  #bandeau {
    position: absolute; left: 50%; top: calc(52px + env(safe-area-inset-top)); transform: translateX(-50%);
    padding: 8px 14px; clip-path: var(--pixel); background: #e9a72e; color: var(--encre);
    box-shadow: inset 0 0 0 2px var(--encre), inset 0 2px 0 2px #ffd56a; font: bold 12px monospace; white-space: nowrap;
    pointer-events: none; transition: opacity .4s, transform .4s;
  }
  #bandeau.cache { opacity: 0; transform: translate(-50%, -8px); }
  #joystick {
    position: absolute; left: 14px; bottom: calc(18px + env(safe-area-inset-bottom)); width: 104px; height: 104px;
    border-radius: 50%; background: rgba(29, 23, 38, 0.55); border: 2px solid var(--encre); touch-action: none;
    display: flex; align-items: center; justify-content: center;
  }
  #joy { width: 44px; height: 44px; clip-path: var(--pixel); background: var(--actif); box-shadow: inset 0 0 0 2px var(--encre), inset 0 3px 0 2px var(--actif-reflet); pointer-events: none; }
</style>
</head>
<body>
<canvas id="monde"></canvas>
<img id="compagnon" src="../compagnons/004_left.gif" alt="">
<canvas id="dessus"></canvas>
<div id="haut">
  <button id="b-matiere"><b>Matière</b><span>Gommage</span></button>
  <button id="b-jet"><b>Jet</b><span>Fin</span></button>
  <a href="../">Jeu</a>
</div>
<div id="bandeau" class="cache"></div>
<div id="joystick"><div id="joy"></div></div>

<script>
"use strict";
// =========================================================
// Tunnel — essai 2 : vue de dessus + jet d'énergie
// - Le monde est fait de petits pixels (3 par « case » du jeu) : le jet peut les effacer un par un.
// - Murs en 3/4 (dessus + face avant haute), vieux sol à découvrir dessous.
// - Mine dans le noir : le mineur a un halo, le jet et les étincelles éclairent.
// - Bouton « Matière » : 4 façons dont la matière part (à comparer en jouant).
// - Zones à déterrer (mousse + objets enfouis) avec effet à 100 %.
// Tout le monde est dessiné dans une petite image (1 pixel = 1 pixel du monde), agrandie ×3 sans flou.
// =========================================================

const P = 3;                       // taille d'un pixel du monde à l'écran (px)
const W = 360, H = 420;            // taille du monde (pixels)
const FH = 6;                      // hauteur de la face avant des murs (pixels)
const VIDE = 0, CRASSE = 1, TERRE = 2, ROCHE = 3, MOUSSE = 4, OBJET = 5, BORD = 6;
const COUL = [null, [70, 66, 58], [139, 94, 60], [118, 116, 124], [104, 146, 74], null, [40, 34, 44]];
const PVMAX = [0, 0.12, 0.35, 1.1, 0.2, 0, 0];
const cassable = t => t >= CRASSE && t <= MOUSSE;

const hache = (x, y, s = 0) => { let h = x * 374761393 + y * 668265263 + s * 2147483647; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const type = new Uint8Array(W * H), base = new Uint8Array(W * H), couche = new Uint8Array(W * H), pv = new Float32Array(W * H);
const ton = new Float32Array(W * H), sol = new Uint8Array(W * H * 3), objC = new Uint8Array(W * H * 3);
const zoneMousse = new Int16Array(W * H), zoneCouv = new Int16Array(W * H);
const dans = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
const typeEn = (x, y) => dans(x, y) ? type[y * W + x] : BORD;
const solide = (x, y) => typeEn(x, y) !== VIDE;

// ---------- Les 4 façons dont la matière part ----------
// grain 1 = pixel par pixel (gommage fin) ; grain 3 = par cases de 3 × 3
// couches = d'abord la crasse, puis la terre, puis la roche
const MATIERES = [
  { nom: "Gommage", grain: 1, couches: false },
  { nom: "Couches", grain: 3, couches: true },
  { nom: "Les deux", grain: 1, couches: true },
  { nom: "Cases", grain: 3, couches: false }
];
let matiere = MATIERES[0];
const pile = b => !matiere.couches || b === MOUSSE ? [b] : b === ROCHE ? [CRASSE, TERRE, ROCHE] : [CRASSE, TERRE];
// En mode « cases », toute la case partage les points de vie de son coin haut-gauche
const origine = (x, y) => matiere.grain === 1 ? y * W + x : (y - y % 3) * W + (x - x % 3);

// ---------- Le vieux sol à découvrir (calculé une fois) ----------
const MOSA = [[176, 92, 64], [212, 176, 96], [72, 120, 140], [226, 214, 190]];
function couleurSol(x, y) {
  const r = hache(x >> 6, y >> 6, 7);
  if (r < 0.3) { // dalles de pierre, en quinconce
    const tx = (x / 10) | 0, yy = y + (tx & 1) * 5, ty = (yy / 10) | 0;
    if (x % 10 === 0 || yy % 10 === 0) return [48, 42, 40];
    const k = (0.85 + 0.3 * hache(tx, ty, 2)) * (hache(x, y, 3) < 0.03 ? 0.7 : 1);
    return [132 * k, 122 * k, 108 * k];
  }
  if (r < 0.5) { // mosaïque en losanges
    if (x % 3 === 0 || y % 3 === 0) return [60, 52, 48];
    const cx = (x / 3) | 0, cy = (y / 3) | 0, d = Math.abs((cx % 10) - 4.5) + Math.abs((cy % 10) - 4.5);
    const c = MOSA[Math.floor(d) % 4], k = 0.9 + 0.15 * hache(cx, cy, 4);
    return [c[0] * k, c[1] * k, c[2] * k];
  }
  if (r < 0.8) { // terre battue traversée de racines
    const v = Math.sin(x * 0.09 + hache(x >> 6, y >> 6, 8) * 6) * 7 + Math.sin(x * 0.23) * 2;
    if (Math.abs((y % 36) - 18 - v) < 1) return [134, 98, 58];
    const k = 0.9 + 0.15 * hache(x >> 1, y >> 1, 5);
    return [96 * k, 78 * k, 60 * k];
  }
  // vieux plancher
  const rang = (y / 5) | 0, px = x + rang * 7;
  if (y % 5 === 0 || px % 24 === 0) return [50, 36, 26];
  if (px % 24 === 2 && y % 5 === 2) return [170, 160, 140];
  const k = 0.85 + 0.25 * hache(rang, (px / 24) | 0, 6);
  return [118 * k, 84 * k, 54 * k];
}

// ---------- Zones à déterrer ----------
const zones = [];
const OBJETS = [
  { nom: "Ammonite", dessin: [".XXX.", "XowXX", "XoXoX", "XXooX", ".XXX."], pal: { X: [234, 223, 196], o: [163, 150, 117], w: [255, 250, 235] } },
  { nom: "Grand os", dessin: ["Xw.....wX", "XXXXXXXXX", "Xo.....oX"], pal: { X: [234, 223, 196], o: [163, 150, 117], w: [255, 250, 235] } },
  { nom: "Cristal", dessin: ["..w..", ".wBX.", "XwBXX", "XBBXo", "XBBXo", ".XXo."], pal: { X: [143, 227, 255], B: [75, 176, 230], o: [42, 111, 176], w: [255, 255, 255] } }
];
const DEPART = { x: 180, y: 90 };

function generer() {
  zones.length = 0; zoneMousse.fill(-1); zoneCouv.fill(-1);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    if (x < 4 || y < 4 || x >= W - 4 || y >= H - 4) { base[i] = BORD; continue; }
    const r = hache(x >> 4, y >> 4, 1) * 0.7 + hache(x >> 2, y >> 2, 2) * 0.3; // roche en plaques
    base[i] = r > 0.74 ? ROCHE : TERRE;
    if (((x - DEPART.x) / 36) ** 2 + ((y - DEPART.y) / 24) ** 2 < 1) base[i] = VIDE;
    const c = couleurSol(x, y); sol[i * 3] = c[0]; sol[i * 3 + 1] = c[1]; sol[i * 3 + 2] = c[2];
    const h = hache((x / 3) | 0, (y / 3) | 0, 3);
    ton[i] = (h < 0.22 ? 0.84 : h > 0.86 ? 1.14 : 1) * (0.96 + 0.08 * hache(x, y, 9));
  }
  // Quelques petites poches déjà vides (on y voit le vieux sol)
  for (let k = 0; k < 10; k++) {
    const cx = 30 + hache(k, 1, 11) * (W - 60), cy = 140 + hache(k, 2, 11) * (H - 180), rx = 10 + hache(k, 3, 11) * 14, ry = 8 + hache(k, 4, 11) * 10;
    for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++)
      if (((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 + (hache(x >> 1, y >> 1, 12) - 0.5) * 0.5 < 1 && base[y * W + x] !== BORD) base[y * W + x] = VIDE;
  }
  // Zones : 4 tout près pour tester vite, d'autres plus loin
  const places = [];
  const libre = (x, y, r) => Math.hypot(x - DEPART.x, (y - DEPART.y) * 1.4) > 48 + r && places.every(p => Math.hypot(p[0] - x, p[1] - y) > p[2] + r + 10);
  let n = 0;
  for (let essai = 0; essai < 4000 && n < 16; essai++) {
    const proche = n < 4, a = Math.random() * Math.PI * 2, d = proche ? 55 + Math.random() * 25 : 60 + Math.random() * 220;
    const x = Math.round(DEPART.x + Math.cos(a) * d), y = Math.round(DEPART.y + Math.abs(Math.sin(a)) * d * (proche ? 0.9 : 1.3) + 10);
    const mousse = n % 2 === 0, r = mousse ? 16 : 18;
    if (x < 24 || y < 24 || x > W - 25 || y > H - 25 || !libre(x, y, r)) continue;
    places.push([x, y, r]);
    if (mousse) creerMousse(x, y); else creerObjet(x, y, OBJETS[(n >> 1) % OBJETS.length]);
    n++;
  }
  // Mise en place des couches et des points de vie
  for (let i = 0; i < W * H; i++) {
    couche[i] = 0;
    type[i] = base[i] === VIDE || base[i] === BORD || base[i] === OBJET ? base[i] : pile(base[i])[0];
    pv[i] = PVMAX[type[i]];
  }
  for (const z of zones) { z.faits = 0; z.total = 0; z.membres = []; }
  for (let i = 0; i < W * H; i++) {
    if (zoneMousse[i] >= 0) { zones[zoneMousse[i]].total++; zones[zoneMousse[i]].membres.push(i); }
    if (zoneCouv[i] >= 0) { zones[zoneCouv[i]].total++; zones[zoneCouv[i]].membres.push(i); }
  }
}
function creerMousse(cx, cy) {
  const id = zones.length, z = { sorte: "mousse", nom: "Mousse", cx, cy, fait: false, touche: 0, brille: 0, bord: [] };
  const rx = 9 + Math.random() * 6, ry = 6 + Math.random() * 5;
  for (let y = cy - 16; y <= cy + 16; y++) for (let x = cx - 18; x <= cx + 18; x++) {
    const d = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 + (hache(x >> 1, y >> 1, 5) - 0.5) * 0.5;
    if (d < 1) { base[y * W + x] = MOUSSE; zoneMousse[y * W + x] = id; }
  }
  // Contour pointillé : pixels de mousse qui touchent autre chose
  for (let y = cy - 16; y <= cy + 16; y++) for (let x = cx - 18; x <= cx + 18; x++) {
    const i = y * W + x;
    if (zoneMousse[i] === id && (zoneMousse[i - 1] !== id || zoneMousse[i + 1] !== id || zoneMousse[i - W] !== id || zoneMousse[i + W] !== id) && (x + y) % 3 === 0) z.bord.push([x, y]);
  }
  zones.push(z);
}
function creerObjet(cx, cy, modele) {
  const id = zones.length, z = { sorte: "objet", nom: modele.nom, cx, cy, fait: false, touche: 0, brille: 0, pixels: [], bord: [] };
  const d = modele.dessin, ox = cx - Math.floor(d[0].length * 3 / 2), oy = cy - Math.floor(d.length * 3 / 2);
  d.forEach((ligne, j) => [...ligne].forEach((ch, k) => {
    if (ch === ".") return;
    const c = modele.pal[ch];
    for (let b = 0; b < 3; b++) for (let a = 0; a < 3; a++) {
      const i = (oy + j * 3 + b) * W + ox + k * 3 + a;
      base[i] = OBJET; z.pixels.push(i);
      const kk = (b === 0 || a === 0) ? 1.08 : (b === 2 || a === 2) ? 0.9 : 1; // petit relief dans chaque « case »
      objC[i * 3] = Math.min(255, c[0] * kk); objC[i * 3 + 1] = Math.min(255, c[1] * kk); objC[i * 3 + 2] = Math.min(255, c[2] * kk);
    }
  }));
  // Couverture : toute la matière à moins de 3 pixels de l'objet
  for (const i of z.pixels) for (let dy = -3; dy <= 3; dy++) for (let dx = -3; dx <= 3; dx++) {
    const v = i + dy * W + dx;
    if (base[v] !== OBJET && base[v] !== VIDE && base[v] !== BORD && zoneCouv[v] < 0) zoneCouv[v] = id;
  }
  zones.push(z);
}

// ---------- Le mineur ----------
const SPRITE = ["...KKKKK....", "..KHYYYYKKK.", ".KHYYYYYKLLK", ".KYYYYYYKLLK", "KyyyyyyyyyyK", "KNNSSSSSSSSK", "KNSSSWESWESK", "KsSSSEESEESK", "KsSSSSPSSPSK", ".KKssssssKK.", "..KRRRRRRK..", ".KSBGBBGBSK.", ".KsBBBBBBsK.", "..KBBBBBBK..", "..KbBBBBbK..", "..KbbKKbbK.."];
const JAMBES = [["..KDDKKDDK..", "..KKK..KKK.."], [".KDDK..KDDK.", ".KKK....KKK."]];
const PAL = { K: [29, 23, 38], H: [255, 224, 138], Y: [242, 178, 50], y: [194, 127, 26], L: [255, 246, 200], N: [107, 70, 48], S: [246, 207, 164], s: [214, 160, 115], W: [255, 255, 255], E: [38, 48, 79], P: [242, 154, 134], R: [217, 86, 60], B: [79, 134, 204], b: [51, 95, 158], G: [255, 213, 106], D: [90, 61, 46] };
const m = { x: DEPART.x, y: DEPART.y + 10, vx: 0, vy: 0, sens: 1, pas: 0 };
// Boîte de collision : seulement les pieds (vue de dessus)
function touche(x, y) {
  for (let cy = Math.floor(y - 3); cy <= Math.floor(y - 0.01); cy++)
    for (let cx = Math.floor(x - 4); cx <= Math.floor(x + 3.99); cx++) if (solide(cx, cy)) return true;
  return false;
}
function bouger(dx, dy) {
  const n = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 0.5) || 1;
  for (let k = 0; k < n; k++) {
    if (dx) { m.x += dx / n; if (touche(m.x, m.y)) { m.x -= dx / n; dx = 0; } }
    if (dy) { m.y += dy / n; if (touche(m.x, m.y)) { m.y -= dy / n; dy = 0; } }
  }
}
const buseX = () => m.x + m.sens * 4, buseY = () => m.y - 8;

// ---------- Effets (déclarés tôt : le minage s'en sert) ----------
const particules = [], anneaux = [], textes = [];
let secousse = 0, tremble = 0;
function particule(x, y, vx, vy, c, vie, brille) { if (particules.length < 700) particules.push({ x, y, vx, vy, c, vie, vie0: vie, brille }); }

// ---------- Creuser ----------
let jet = "fin", doigt = null, tir = null; // tir = { traits: [[x1,y1,x2,y2,coeur]], impact: [x,y], mat }
function abimer(x, y, q, vues) {
  if (!dans(x, y)) return;
  let o = origine(x, y);
  if (!cassable(type[o])) o = y * W + x; // (coin de la case déjà vide : on s'occupe du pixel lui-même)
  if (!cassable(type[o])) return;
  if (vues) { if (vues.has(o)) return; vues.add(o); } // (mode cases : une seule fois par image)
  pv[o] -= q;
  const zm = zoneMousse[o] >= 0 ? zoneMousse[o] : zoneCouv[o];
  if (zm >= 0) zones[zm].touche = 2.5;
  if (pv[o] <= 0) avancer(o);
}
// La matière a « cédé » : couche suivante, ou elle éclate
let dernierTic = 0, eclatsImage = 0;
function avancer(o) {
  const ox = o % W, oy = (o / W) | 0, g = matiere.grain;
  let casse = false;
  for (let b = 0; b < g; b++) for (let a = 0; a < g; a++) {
    const x = ox + a, y = oy + b, i = y * W + x;
    if (!dans(x, y) || !cassable(type[i])) continue;
    const pl = pile(base[i]);
    if (couche[i] + 1 < pl.length) { couche[i]++; type[i] = pl[couche[i]]; pv[i] = PVMAX[type[i]]; continue; }
    const c = COUL[type[i]];
    type[i] = VIDE; casse = true;
    if (zoneMousse[i] >= 0) compter(zoneMousse[i]);
    if (zoneCouv[i] >= 0) compter(zoneCouv[i]);
    // Éclats : un peu de matière + étincelles qui brillent
    if (eclatsImage < 40 && Math.random() < (g === 3 ? 0.6 : 0.35)) {
      eclatsImage++;
      const a = Math.random() * Math.PI * 2, v = 20 + Math.random() * 50;
      particule(x + 0.5, y + 0.5, Math.cos(a) * v, Math.sin(a) * v, c, 0.4 + Math.random() * 0.3, false);
      if (Math.random() < 0.6) particule(x + 0.5, y + 0.5, Math.cos(a + 1) * v * 1.4, Math.sin(a + 1) * v * 1.4, [255, 200, 90], 0.3 + Math.random() * 0.3, true);
    }
  }
  if (casse && g === 3) secousse = Math.max(secousse, 0.12); // mode cases : petit choc à chaque case
  if (casse) tic(type[o]);
}
// Comme dans Power Wash : à 95 %, la zone est finie et le reste part tout seul
const SEUIL = 0.95;
function compter(id) { const z = zones[id]; if (z.fait) return; z.faits++; if (z.faits >= z.total * SEUIL) terminer(z); }

// Rayon depuis la buse : s'arrête sur le premier pixel solide
function rayon(ox, oy, a, longueur) {
  const dx = Math.cos(a), dy = Math.sin(a);
  for (let d = 0; d < longueur; d += 0.5) {
    const x = ox + dx * d, y = oy + dy * d;
    if (solide(Math.floor(x), Math.floor(y))) return [x, y, d, typeEn(Math.floor(x), Math.floor(y))];
  }
  return [ox + dx * longueur, oy + dy * longueur, longueur, VIDE];
}
function pinceau(x, y, r, q, vues) {
  for (let py = Math.floor(y - r); py <= y + r; py++) for (let px = Math.floor(x - r); px <= x + r; px++) {
    const d = Math.hypot(px + 0.5 - x, py + 0.5 - y);
    if (d <= r) abimer(px, py, q * (1 - 0.6 * d / r), vues);
  }
}
function creuser(dt) {
  tir = null;
  if (!doigt) return;
  const wx = camX + doigt.sx / P, wy = camY + doigt.sy / P;
  const ox = buseX(), oy = buseY(), a = Math.atan2(wy - oy, wx - ox);
  m.sens = Math.cos(a) >= 0 ? 1 : -1;
  const vues = matiere.grain === 3 ? new Set() : null;
  tir = { traits: [], impact: null, mat: VIDE };
  if (jet === "fin") {
    for (const dec of [-1, 0, 1]) {
      const px = ox - Math.sin(a) * dec, py = oy + Math.cos(a) * dec;
      const [hx, hy, , t] = rayon(px, py, a, 80);
      if (t !== VIDE) pinceau(hx, hy, 2.6, 5 * dt, vues);
      tir.traits.push([px, py, hx, hy, dec === 0]);
      if (dec === 0) { tir.impact = t !== VIDE ? [hx, hy] : null; tir.mat = t; }
    }
  } else {
    let pres = 99;
    for (let k = -4; k <= 4; k++) {
      const b = a + k * 0.09, [hx, hy, d, t] = rayon(ox, oy, b, 34);
      if (t !== VIDE) pinceau(hx, hy, 1.6, 2.2 * dt, vues);
      tir.traits.push([ox, oy, hx, hy, k === 0]);
      if (t !== VIDE && d < pres) { pres = d; tir.impact = [hx, hy]; tir.mat = t; }
    }
  }
  // Recul : le dessin du mineur tremble d'1 pixel vers l'arrière (il ne recule pas vraiment)
  m.recul = Math.random() < 0.5 ? [-Math.round(Math.cos(a)), -Math.round(Math.sin(a))] : [0, 0];
  // Étincelles à l'impact
  if (tir.impact && Math.random() < 0.8) {
    const [ix, iy] = tir.impact, b = a + Math.PI + (Math.random() - 0.5) * 2.2, v = 30 + Math.random() * 60;

function dessinerMonde(temps) {
  const ox = Math.floor(camX), oy = Math.floor(camY), AMB = 0.05;

// Calque du dessus (pleine résolution) : pointillés des zones, %, onde, « 100 % »

    if (!z.fait) {

    }
    if (z.brille > 0) {

      for (let k = 0; k < 30; k++) { const a = Math.random() * Math.PI * 2, d = Math.random() * 22; cd.fillRect(E(z.cx + Math.cos(a) * d), F(z.cy + Math.sin(a) * d * 0.7), P, P); }
    }

      cd.fillStyle = "#ffe7c2"; cd.fillText(p, E(z.cx), F(z.cy) - 40);

  // Vibration légère continue pendant le tir (plus forte sur la roche)
  if (tir) { vibreTemps -= dt; if (vibreTemps <= 0) { vibreTemps = 0.11; vibrer(tir.mat === ROCHE ? 22 : tir.mat === VIDE ? 0 : 12); } tremble = 1; } else tremble = 0;
  const cx = m.x - largeur / P / 2, cy = m.y - 8 - hauteur / P / 2;
  camX += (cx - camX) * Math.min(1, dt * 6); camY += (cy - camY) * Math.min(1, dt * 6);
  camY = Math.max(-2, camY); // pas de grande bande noire au-dessus du monde
  for (const p of particules) {
    p.vie -= dt;
    const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
    // Rebond sur les murs
    if (solide(Math.floor(nx), Math.floor(p.y))) p.vx *= -0.5; else p.x = nx;
    if (solide(Math.floor(p.x), Math.floor(ny))) p.vy *= -0.5; else p.y = ny;
    p.vx *= 1 - dt * 2.5; p.vy *= 1 - dt * 2.5;
  }
  for (let k = particules.length - 1; k >= 0; k--) if (particules[k].vie <= 0) particules.splice(k, 1);
  for (const o of anneaux) o.t += dt;
  while (anneaux.length && anneaux[0].t > 0.8) anneaux.shift();
  for (const t of textes) t.t += dt;
  while (textes.length && textes[0].t > 1.5) textes.shift();
  for (const z of zones) { z.touche -= dt; z.brille = Math.max(0, z.brille - dt); }
  secousse = Math.max(0, secousse - dt);
  // Secousse : forte et courte (fin de zone, cases), ou légère et continue (pendant le tir)
  const amp = secousse * 10 + tremble * 1.2;
  sx = amp ? (Math.random() - 0.5) * amp : 0; sy = amp ? (Math.random() - 0.5) * amp : 0;
  majLumieres(temps);
  dessinerMonde(temps);
  const fx = (camX - Math.floor(camX)) * P, fy = (camY - Math.floor(camY)) * P;
  canMonde.style.transform = "translate(" + (-fx + sx).toFixed(2) + "px," + (-fy + sy).toFixed(2) + "px)";
  majCompagnon(dt);
  dessinerDessus();
}
function boucle(maintenant) {
  const dt = Math.min(0.05, (maintenant - avant) / 1000); avant = maintenant;
  etape(dt, maintenant / 1000);

}
nouvelleMine();
requestAnimationFrame(boucle);
